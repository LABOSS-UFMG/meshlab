# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshlab"
version = "0.1.0"
description = "A Python toolkit for mesh generation and manipulation."
authors = [{ name="Lucas Ribeiro Alves", email="lucas.ra.mast@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.7",
    "gmsh>=4.15.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
homepage = "https://github.com/LABOSS-UFMG/meshlab"
repository = "https://github.com/LABOSS-UFMG/meshlab"
issues = "https://github.com/LABOSS-UFMG/meshlab/issues"

[tool.setuptools.packages.find]
where = [""]

[tool.pytest.ini_options]
pythonpath = [""]